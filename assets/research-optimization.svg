<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
<title id="title">From task dependencies to a feasible schedule</title><desc id="desc">Illustrative four-task example. A precedes C; B and C precede D. Resource 1 runs A from 0 to 2 and D from 4 to 6. Resource 2 runs B from 0 to 3. Resource 3 runs C from 2 to 4. No tasks overlap on the same resource.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#62798c" stroke-width="1.3"/></marker></defs>
<rect width="960" height="460" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif" fill="#222">
<text x="28" y="38" font-size="24" font-weight="600">Structure matters in scheduling</text><text x="28" y="67" font-size="16" fill="#626262">A decision about one task changes the options available to others.</text><path d="M28 90H932" stroke="#dedede"/>
<text x="28" y="121" font-size="19" font-weight="600">Task dependencies</text><text x="445" y="121" font-size="19" font-weight="600">One feasible assignment and schedule</text>
<g fill="none" stroke="#62798c" stroke-width="1.8" marker-end="url(#arrow)"><path d="M102 197H171"/><path d="M229 197H298"/><path d="M102 285H260Q327 285 327 226"/></g>
<g stroke-width="1.6"><circle cx="74" cy="197" r="27" fill="#e7f0f8" stroke="#397aa8"/><circle cx="200" cy="197" r="27" fill="#edf2e8" stroke="#6a8458"/><circle cx="327" cy="197" r="27" fill="#f4ede1" stroke="#a3824b"/><circle cx="74" cy="285" r="27" fill="#edf0f3" stroke="#728398"/></g>
<g text-anchor="middle" font-size="21" font-weight="600"><text x="74" y="204">A</text><text x="200" y="204">C</text><text x="327" y="204">D</text><text x="74" y="292">B</text></g>
<g text-anchor="middle" fill="#626262" font-size="14"><text x="135" y="178">before</text><text x="264" y="178">before</text><text x="177" y="274">before D</text></g>
<g stroke="#e5e9ec"><path d="M558 160V322M618 160V322M678 160V322M738 160V322M798 160V322M858 160V322M918 160V322"/><path d="M558 213H918M558 263H918M558 313H918"/></g>
<g fill="#626262" font-size="15" text-anchor="end"><text x="542" y="198">Resource 1</text><text x="542" y="248">Resource 2</text><text x="542" y="298">Resource 3</text></g>
<g stroke-width="1.5"><rect x="558" y="175" width="120" height="32" fill="#e7f0f8" stroke="#397aa8"/><rect x="798" y="175" width="120" height="32" fill="#f4ede1" stroke="#a3824b"/><rect x="558" y="225" width="180" height="32" fill="#edf0f3" stroke="#728398"/><rect x="678" y="275" width="120" height="32" fill="#edf2e8" stroke="#6a8458"/></g>
<g text-anchor="middle" font-size="17" font-weight="600"><text x="618" y="197">A</text><text x="858" y="197">D</text><text x="648" y="247">B</text><text x="738" y="297">C</text></g>
<g fill="#626262" font-size="14" text-anchor="middle"><text x="558" y="346">0</text><text x="618" y="346">1</text><text x="678" y="346">2</text><text x="738" y="346">3</text><text x="798" y="346">4</text><text x="858" y="346">5</text><text x="918" y="346">6</text></g>
<text x="918" y="370" text-anchor="end" fill="#626262" font-size="14">Illustrative time units</text><path d="M28 391H932" stroke="#dedede"/>
<text x="28" y="419" font-size="16">Precedence: required tasks finish first.</text><text x="445" y="419" font-size="16">Capacity: tasks sharing a resource cannot overlap.</text><text x="28" y="444" font-size="13" fill="#626262">Conceptual example · no performance claim or experimental data</text></g></svg>
